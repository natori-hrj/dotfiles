ansi_1 = "graphite_04"
ansi_2 = "graphite_05"
ansi_3 = "graphite_06"
ansi_4 = "graphite_05"
ansi_5 = "graphite_06"
ansi_6 = "graphite_07"
ansi_7 = "graphite_13"
ansi_8 = "graphite_06"
ansi_9 = "graphite_08"
ansi_10 = "graphite_09"
ansi_11 = "graphite_10"
ansi_12 = "graphite_09"
ansi_13 = "graphite_10"
ansi_14 = "graphite_11"
ansi_15 = "graphite_14"

[roles.terminal]
ansi_1 = "error_dark"

[roles.hyprland]
active_border = "graphite_10"
inactive_border = "graphite_03"
