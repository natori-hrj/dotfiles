[swatches]
transparent = "#00000000"
black = "#000000"
graphite_01 = "#141415"
graphite_02 = "#19191a"
graphite_03 = "#2d2d2f"
graphite_04 = "#383739"
graphite_05 = "#474649"
graphite_06 = "#4d4b4e"
graphite_07 = "#565558"
graphite_08 = "#7a787d"
graphite_09 = "#8a878c"
graphite_10 = "#99979b"
graphite_11 = "#aba9ad"
graphite_12 = "#bfbec1"
graphite_13 = "#d1d0d2"
graphite_14 = "#e0e0e1"
error_dark = "#792a52"
error_light = "#c7487a"

[roles.core]
